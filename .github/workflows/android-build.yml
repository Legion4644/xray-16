name: Android

on:
  push:
    branches:
      - android-port
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  android-arm64:
    name: Android arm64-v8a API 26 (NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CFLAGS: "-w"
      CXXFLAGS: "-w"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools for LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -qq -y build-essential

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=ReleaseMasterGold \
            -DBUILD_SHARED_LIBS=OFF \
            -DXRAY_USE_LUAJIT=ON \
            -DCMAKE_UNITY_BUILD=ON \
            -DCMAKE_INSTALL_PREFIX="${PWD}/install-android"

      - name: Build
        run: cmake --build build-android --config ReleaseMasterGold --parallel 4

      - name: Collect libraries
        run: |
          mkdir -p dist/arm64-v8a
          find build-android bin -type f \( -name '*.so' -o -name '*.a' \) -print -exec cp -n {} dist/arm64-v8a/ \; || true
          ls -la dist/arm64-v8a || true

      - name: Upload Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: dist/arm64-v8a
          if-no-files-found: warn
