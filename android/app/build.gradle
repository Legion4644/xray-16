apply plugin: 'com.android.application'

android {
    namespace 'com.xray.cop'
    compileSdk 34

    defaultConfig {
        applicationId "com.xray.cop"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The native libraries are produced by the CMake build (Marco 1/2) and
    // copied here by the CI workflow before Gradle runs.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
